[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hmi-infill"
version = "0.1.0"
description = "Signal infill for SDO/HMI images transmitted as CCSDS 133 packets with CCSDS 122 compression"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "astropy>=6.0",
    "numba>=0.60",
    "matplotlib>=3.8",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
download = ["drms>=0.7"]
notebooks = ["jupyterlab>=4", "ipykernel", "nbformat", "nbconvert"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
